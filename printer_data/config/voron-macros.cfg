#####################################################################
# Speed Benchy Optimized Macros
#####################################################################

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}

    # Start heating both heaters simultaneously (non-blocking)
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

    # Home while heating to save time
    G28

    # Wait for target temps
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Zero extruder position
	LINE_PURGE

[gcode_macro PRINT_END]
gcode:
    # Turn off all heaters and part cooling immediately
    M104 S0
    M140 S0
    M107

    # Relative movement for quick retract and clearance
    G91
    G1 E-2 F3600               ; Quick retract to prevent stringing
    G1 Z2 F3000                ; Fast Z-hop
    G90

    # Fast park (adjust X/Y to your bed bounds if needed)
    G0 X10 Y10 F18000

    # Clear motor locks if required by rules, or keep energized
    # M84


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT


#####################################################################
# Speed Run Pause & Resume Macros
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SAVE_GCODE_STATE NAME=PAUSE_state
        BASE_PAUSE
        G91
        G1 E-2 F3600                   ; Quick retract to stop ooze
        G1 Z{z} F3000                  ; Minimal Z-hop clearance
        G90
        G0 X0 Y0 F18000                ; Rapid park to corner
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        G91
        G1 E2 F3600                    ; Prime back the retracted length
        G90
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=300 ; Return to print position fast
        BASE_RESUME
    {% endif %}